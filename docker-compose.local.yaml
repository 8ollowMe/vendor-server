version: "3.8"

services:
  vendor-postgres:
    image: postgres:16-alpine
    container_name: vendor-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - vendor_postgres_data:/var/lib/postgresql/data

  vendor-redis:
    image: redis:7-alpine
    container_name: vendor-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - vendor_redis_data:/data

volumes:
  vendor_postgres_data:
  vendor_redis_data:
